<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>朋友對我的動態留言板</title>
  
  <!-- 引入可愛風格的 Google Fonts 字體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">

  <style>
    /* =========================================================
       1. 全局樣式與變數設定 (方便後續修改顏色與風格)
       ========================================================= */
    :root {
      /* 【顏色設定】你可以在這裡修改主題顏色 */
      --bg-color: #fff6f8;            /* 網頁背景色 (溫柔粉白) */
      --card-bg: #ffffff;             /* 卡片背景色 */
      --primary-color: #ff8fa3;        /* 主題粉紅色 */
      --secondary-color: #ffb5a7;      /* 次要粉橘色 */
      --accent-color: #ff4d6d;         /* 高亮焦點顏色 */
      --text-color: #4a4e69;           /* 主要文字顏色 */
      --text-muted: #9a8c98;          /* 次要/時間文字顏色 */
      
      /* 【輪播高亮發光顏色】可自由更換發光顏色與陰影 */
      --highlight-shadow: 0 0 25px rgba(255, 77, 109, 0.6);
      --highlight-border: #ff4d6d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      font-family: 'Zen Maru Gothic', 'Fredoka', sans-serif, system-ui;
      color: var(--text-color);
      padding: 2rem 1rem;
      min-height: 100vh;
      /* 背景可愛點點花紋 */
      background-image: radial-gradient(#ffcad4 15%, transparent 16%), radial-gradient(#ffcad4 15%, transparent 16%);
      background-size: 60px 60px;
      background-position: 0 0, 30px 30px;
    }

    /* 頁面標題 */
    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-size: 2.2rem;
      color: var(--accent-color);
      letter-spacing: 2px;
      text-shadow: 2px 2px 0px #fff;
      display: inline-block;
      position: relative;
    }

    header h1::after {
      content: '✨';
      position: absolute;
      right: -35px;
      top: -5px;
    }

    header h1::before {
      content: '✨';
      position: absolute;
      left: -35px;
      top: -5px;
    }

    /* =========================================================
       2. 載入中動畫 (Loading Animation)
       ========================================================= */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 5rem;
    }

    .loader-heart {
      display: inline-block;
      position: relative;
      width: 80px;
      height: 80px;
      transform: rotate(45deg);
      transform-origin: 40px 40px;
      animation: heartbeat 1.2s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
    }

    .loader-heart div {
      top: 32px;
      left: 32px;
      position: absolute;
      width: 32px;
      height: 32px;
      background: var(--accent-color);
      animation: heart-pulse 1.2s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
    }

    .loader-heart div:after,
    .loader-heart div:before {
      content: " ";
      position: absolute;
      display: block;
      width: 32px;
      height: 32px;
      background: var(--accent-color);
    }

    .loader-heart div:before {
      left: -24px;
      border-radius: 50% 0 0 50%;
    }

    .loader-heart div:after {
      top: -24px;
      border-radius: 50% 50% 0 0;
    }

    @keyframes heartbeat {
      0% { transform: scale(0.95) rotate(45deg); }
      5% { transform: scale(1.1) rotate(45deg); }
      39% { transform: scale(0.85) rotate(45deg); }
      45% { transform: scale(1) rotate(45deg); }
      60% { transform: scale(0.95) rotate(45deg); }
      100% { transform: scale(0.9) rotate(45deg); }
    }

    #loading p {
      margin-top: 1.5rem;
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--primary-color);
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* =========================================================
       3. 瀑布流排版 (Masonry Layout)
       ========================================================= */
    .masonry-container {
      max-width: 1200px;
      margin: 0 auto;
      /* 預設 3 欄 (電腦螢幕) */
      column-count: 3;
      column-gap: 1.5rem;
      display: none; /* 載入完成後會經由 JS 改為 block */
    }

    /* 響應式欄位調整 */
    @media (max-width: 900px) {
      .masonry-container {
        column-count: 2; /* 平板顯示 2 欄 */
      }
    }

    @media (max-width: 600px) {
      .masonry-container {
        column-count: 1; /* 手機顯示 1 欄 */
      }
    }

    /* =========================================================
       4. 留言卡片樣式與焦點特效
       ========================================================= */
    .card {
      background-color: var(--card-bg);
      border-radius: 20px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      break-inside: avoid; /* 避免卡片在瀑布流中被跨欄截斷 */
      box-shadow: 0 8px 16px rgba(0,0,0,0.04);
      border: 3px solid transparent;
      
      /* 設定平滑過渡動畫，讓輪播切換時感覺自然 */
      transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
      position: relative;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.8rem;
      border-bottom: 2px dashed #f0e6ed;
      padding-bottom: 0.5rem;
    }

    .card-author {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--primary-color);
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .card-time {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .card-content {
      font-size: 0.98rem;
      line-height: 1.6;
      word-break: break-word;
      white-space: pre-wrap; /* 保留留言換行狀態 */
    }

    /* 【重點特效 A】被聚焦/選中的卡片樣式 (Highlight) */
    .card.highlight {
      transform: scale(1.08); /* 放大卡片 */
      z-index: 10;
      border-color: var(--highlight-border); /* 加上亮色邊框 */
      box-shadow: var(--highlight-shadow); /* 外發光特效 */
      opacity: 1 !important;
      filter: blur(0px) !important;
    }

    /* 【重點特效 B】沒被選中的卡片模糊/變暗樣式 (Dimmed) */
    .masonry-container.has-active .card:not(.highlight) {
      opacity: 0.45; /* 透明度降低變暗 */
      filter: blur(1.5px); /* 微模糊特效 */
      transform: scale(0.96); /* 稍微縮小 */
    }

  </style>
</head>
<body>

  <!-- 頁面標頭 -->
  <header>
    <h1>朋友對我的動態留言板</h1>
  </header>

  <!-- 載入中動畫區塊 -->
  <div id="loading">
    <div class="loader-heart"><div></div></div>
    <p>讀取留言中...</p>
  </div>

  <!-- 瀑布流留言牆容器 -->
  <main class="masonry-container" id="cards-container"></main>

  <!-- =========================================================
     5. JavaScript 邏輯 (資料讀取、CSV解析、動態卡片與輪播)
     ========================================================= -->
  <script>
    // 【設定 1：資料來源網址】
    const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTHoXZ5C8ZJlY_r2ar7b-63ciYMxkeYqBGT5buO8yTksqjZR8_sjIvXLHOVQCbdHn7yfxheFhhi9RIj/pub?output=csv';

    // 【設定 2：輪播間隔時間 (毫秒)】
    // 3000 代表 3 秒鐘切換下一張卡片，若想改成 5 秒可改為 5000
    const ROTATE_INTERVAL = 3000; 

    // DOM 元素選取
    const loadingEl = document.getElementById('loading');
    const containerEl = document.getElementById('cards-container');

    // 全域變數存卡片與定時器
    let cards = [];
    let currentIndex = 0;
    let carouselTimer = null;

    /* ---------------------------------------------------------
       CSV 安全解析器 (可妥善處理留言內部含有雙引號與逗號的情況)
       --------------------------------------------------------- */
    function parseCSV(text) {
      const lines = [];
      let row = [];
      let currentField = '';
      let insideQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"') {
          if (insideQuotes && nextChar === '"') {
            currentField += '"';
            i++; // 跳過下一個轉義的雙引號
          } else {
            insideQuotes = !insideQuotes; // 切換雙引號狀態
          }
        } else if (char === ',' && !insideQuotes) {
          row.push(currentField.trim());
          currentField = '';
        } else if ((char === '\r' || char === '\n') && !insideQuotes) {
          if (char === '\r' && nextChar === '\n') {
            i++; // 處理 Windows \r\n 換行
          }
          row.push(currentField.trim());
          if (row.length > 1 || row[0] !== '') {
            lines.push(row);
          }
          row = [];
          currentField = '';
        } else {
          currentField += char;
        }
      }

      if (currentField || row.length > 0) {
        row.push(currentField.trim());
        lines.push(row);
      }

      return lines;
    }

    /* ---------------------------------------------------------
       Fetch API 讀取 CSV 並動態產生卡片
       --------------------------------------------------------- */
    async function fetchAndRenderMessages() {
      try {
        const response = await fetch(csvUrl);
        if (!response.ok) throw new Error('網路回應不成功');
        
        const csvText = await response.text();
        const parsedData = parseCSV(csvText);

        // 如果 CSV 有標頭 (第一列為「時間戳記, 名字, 悄悄話」)，我們忽略第一列
        const rows = parsedData.slice(1);

        // 清空容器
        containerEl.innerHTML = '';

        if (rows.length === 0) {
          containerEl.innerHTML = '<p style="text-align:center; grid-column:1/-1;">目前還沒有任何留言喔！</p>';
          loadingEl.style.display = 'none';
          containerEl.style.display = 'block';
          return;
        }

        // 動態卡片可用的可愛小 Icon 陣列
        const cuteIcons = ['🎀', '🌸', '🧸', '🐣', '🍓', '🍭', '⭐', '🐱'];

        // 走訪每一筆留言資料並製作 HTML 卡片
        rows.forEach((row, index) => {
          // 欄位順序：[0] 時間戳記, [1] 名字, [2] 悄悄話內容
          const timestamp = row[0] || '';
          const name = row[1] || '匿名朋友';
          const message = row[2] || '';

          // 隨機選一個可愛圖示
          const randomIcon = cuteIcons[index % cuteIcons.length];

          // 建立卡片 DOM 元素
          const card = document.createElement('div');
          card.classList.add('card');
          card.innerHTML = `
            <div class="card-header">
              <span class="card-author">${randomIcon} ${escapeHtml(name)}</span>
              <span class="card-time">${escapeHtml(timestamp.split(' ')[0])}</span>
            </div>
            <div class="card-content">${escapeHtml(message)}</div>
          `;

          containerEl.appendChild(card);
        });

        // 隱藏載入中動畫，顯示留言牆
        loadingEl.style.display = 'none';
        containerEl.style.display = 'block';

        // 取得所有產生的卡片元件，準備開啟輪播效果
        cards = document.querySelectorAll('.card');
        if (cards.length > 0) {
          startCarousel();
        }

      } catch (error) {
        console.error('讀取 Google 試算表失敗:', error);
        loadingEl.innerHTML = `<p style="color:#ff4d6d;">載入留言失敗，請確認網路連線或 CSV 網址是否公開。</p>`;
      }
    }

    /* ---------------------------------------------------------
       【重點功能】每隔 3 秒卡片輪播高亮特效
       --------------------------------------------------------- */
    function startCarousel() {
      // 啟用容器的 has-active 狀態，讓其他未被選中的卡片自動縮小變暗
      containerEl.classList.add('has-active');

      // 立即執行一次第一張高亮
      highlightCard(currentIndex);

      // 設定定時器，每隔指定時間 (ROTATE_INTERVAL) 輪播下一張
      carouselTimer = setInterval(() => {
        currentIndex = (currentIndex + 1) % cards.length; // 循環回到 0
        highlightCard(currentIndex);
      }, ROTATE_INTERVAL);
    }

    function highlightCard(index) {
      // 移除所有卡片的 highlight 類別
      cards.forEach(card => card.classList.remove('highlight'));

      // 幫當前選中的卡片加上 highlight 類別
      const targetCard = cards[index];
      targetCard.classList.add('highlight');

      // (可選) 讓視窗微平滑滾動至目前高亮的卡片位置，提升展覽觀賞體驗
      targetCard.scrollIntoView({
        behavior: 'smooth',
        block: 'nearest'
      });
    }

    /* 防止 XSS 攻擊的安全文字轉換機制 */
    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // 頁面載入完成後開始執行主程式
    document.addEventListener('DOMContentLoaded', fetchAndRenderMessages);
  </script>
</body>
</html>
